services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agentic_postgres
    environment:
      POSTGRES_USER: ${PG_USER:-agentic_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agentic_secure_pass}
      POSTGRES_DB: ${PG_DATABASE:-agentic_code_rag_db}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - agentic_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-agentic_user} -d ${PG_DATABASE:-agentic_code_rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentic_pgdata:
    driver: local
